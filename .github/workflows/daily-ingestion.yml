name: Daily Job Ingestion

# ============================================================
# Runs the data collection pipeline once per day at 06:00 UTC.
# Classification is INTENTIONALLY excluded from this workflow
# to protect Gemini API quota.
#
# To run classification manually:
#   Actions → "Daily Job Ingestion" → Run workflow → check "classify"
# ============================================================

on:
  schedule:
    # 06:00 UTC = 11:30 IST daily
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      run_classify:
        description: 'Run AI classification after collection (uses Gemini quota)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      classify_limit:
        description: 'Max jobs to classify (Gemini Free Tier: 5 RPM)'
        required: false
        default: '50'

concurrency:
  group: ingestion
  cancel-in-progress: false   # never cancel a running ingestion mid-way

jobs:
  collect:
    name: Collect Jobs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: fresher_jobs
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/fresher_jobs?schema=public
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash
      LOG_LEVEL: INFO
      INGESTION_BATCH_SIZE: 50
      INGESTION_MAX_PAGES: 10
      CLASSIFICATION_BATCH_SIZE: 20
      CLASSIFICATION_MAX_RETRIES: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: ingestion/requirements.txt

      - name: Install ingestion dependencies
        working-directory: ingestion
        run: pip install -r requirements.txt

      - name: Install Node.js (for Prisma migrations)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install API dependencies
        working-directory: apps/api
        run: pnpm install --frozen-lockfile

      - name: Run Prisma migrations
        working-directory: apps/api
        run: pnpm prisma:deploy

      - name: Verify database connection
        working-directory: ingestion
        run: python main.py --stage test-db

      - name: Run job collection (all sources)
        working-directory: ingestion
        run: python main.py --stage collect

      - name: Run AI classification (manual only, quota-protected)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_classify == 'true' }}
        working-directory: ingestion
        run: python main.py --stage classify --limit ${{ github.event.inputs.classify_limit || '50' }}
        env:
          # Fail gracefully if Gemini is unavailable — do not fail the workflow
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload ingestion logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-failure-log-${{ github.run_id }}
          path: ingestion/logs/
          if-no-files-found: ignore
